name: Update Aircraft Data

on:
  schedule:
    - cron: "2/5 * * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: flightboard-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create website directory
        run: |
          mkdir -p _site
          cp index.html app.js _site/
          sed -i "s|src=\"app.js\"|src=\"app.js?v=${GITHUB_SHA}\"|" _site/index.html
          if [ -d logos ]; then
            cp -R logos _site/logos
          fi

      - name: Fetch aircraft data and route
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const CONFIG = {
            latitude: 48.2082,
            longitude: 16.3738,
            radius: 15
          };

          function distanceKm(lat1, lon1, lat2, lon2) {
            const rad = Math.PI / 180;
            const dLat = (lat2 - lat1) * rad;
            const dLon = (lon2 - lon1) * rad;

            const a =
              Math.sin(dLat / 2) ** 2 +
              Math.cos(lat1 * rad) *
              Math.cos(lat2 * rad) *
              Math.sin(dLon / 2) ** 2;

            return 6371 * 2 * Math.asin(Math.sqrt(a));
          }

          async function getAircraft() {
            const url =
              `https://opendata.adsb.fi/api/v3/lat/` +
              `${CONFIG.latitude}/lon/${CONFIG.longitude}` +
              `/dist/${CONFIG.radius}`;

            const response = await fetch(url, {
              signal: AbortSignal.timeout(20000)
            });

            if (!response.ok) {
              throw new Error(`ADSB.fi HTTP ${response.status}`);
            }

            const data = await response.json();

            if (!Array.isArray(data.ac)) {
              throw new Error("Invalid aircraft response");
            }

            return data.ac;
          }

          async function getRoute(callsign) {
            if (!callsign) return null;

            try {
              const url =
                "https://api.adsbdb.com/v0/callsign/" +
                encodeURIComponent(callsign);

              const response = await fetch(url, {
                headers: {
                  "Accept": "application/json"
                },
                signal: AbortSignal.timeout(8000)
              });

              if (!response.ok) {
                console.log(
                  `Route lookup: HTTP ${response.status}`
                );
                return null;
              }

              const data = await response.json();
              const route = data.response?.flightroute;

              const origin = route?.origin?.iata_code;
              const destination =
                route?.destination?.iata_code;

              const valid = code =>
                typeof code === "string" &&
                /^[A-Z]{3}$/.test(code.toUpperCase());

              if (!valid(origin) || !valid(destination)) {
                return null;
              }

              return (
                origin.toUpperCase() +
                "-" +
                destination.toUpperCase()
              );

            } catch (error) {
              console.log("Route lookup failed:", error.message);
              return null;
            }
          }

          async function main() {
            const aircraft = await getAircraft();

            const nearest = aircraft
              .filter(a =>
                Number.isFinite(a.lat) &&
                Number.isFinite(a.lon) &&
                a.airground !== "GND" &&
                a.alt_baro !== "ground" &&
                (a.seen_pos == null || a.seen_pos < 90)
              )
              .map(a => ({
                aircraft: a,
                distance: distanceKm(
                  CONFIG.latitude,
                  CONFIG.longitude,
                  a.lat,
                  a.lon
                )
              }))
              .filter(a =>
                a.distance <= CONFIG.radius * 1.852
              )
              .sort((a, b) => a.distance - b.distance)[0]
              ?.aircraft;

            if (nearest) {
              const callsign = String(nearest.flight ?? "")
                .trim()
                .toUpperCase();

              nearest.route = await getRoute(callsign);

              console.log(
                `Selected: ${callsign || "UNKNOWN"}`
              );
              console.log(
                `Route: ${nearest.route || "UNKNOWN"}`
              );
            }

            fs.writeFileSync(
              "_site/flights.json",
              JSON.stringify({
                fetchedAt: new Date().toISOString(),
                ac: aircraft
              })
            );

            console.log(
              `Successfully processed ${aircraft.length} aircraft`
            );
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
