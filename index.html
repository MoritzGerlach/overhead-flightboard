<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101312">
  <title>OVERHEAD · Vienna</title>

  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #e9e7dd;
      background: #101312;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .viewport {
      height: 100svh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 3vw, 36px);
    }

    .board {
      width: min(1120px, 100%);
      max-height: 100%;
      background: #1b1f1e;
      border: 1px solid #353b37;
      box-shadow: 0 22px 80px #0009;
      padding: clamp(18px, 3.3vw, 42px);
      display: flex;
      flex-direction: column;
      gap: clamp(14px, 2.3vh, 25px);
    }

    .mast {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      border-bottom: 1px solid #41463f;
      padding-bottom: 18px;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: .3em;
      color: #b4a987;
      margin-bottom: 8px;
    }

    .mast h1 {
      margin: 0;
      font-size: clamp(21px, 4vw, 42px);
      font-weight: 600;
      letter-spacing: .04em;
    }

    .mastRight {
      text-align: right;
      color: #aaa99c;
      font-size: 11px;
      letter-spacing: .15em;
      white-space: nowrap;
    }

    .signal {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #be8f48;
      margin-right: 9px;
    }

    .rows {
      display: grid;
      gap: clamp(9px, 1.65vh, 17px);
    }

    .dataRow {
      display: grid;
      grid-template-columns: minmax(95px, 21%) minmax(0, 1fr);
      gap: clamp(10px, 2vw, 28px);
      align-items: center;
      min-width: 0;
    }

    .name {
      font-size: 11px;
      letter-spacing: .17em;
      color: #a9aaa0;
      font-weight: 600;
    }

    .cells {
      min-width: 0;
      display: grid;
      grid-template-columns:
        repeat(var(--slots), minmax(0, 1fr));
      gap: clamp(2px, .42vw, 6px);
    }

    .cell {
      position: relative;
      min-width: 0;
      height: clamp(41px, 7.8vh, 75px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 3px;

      background: linear-gradient(
        #303532 0%,
        #282d2a 48%,
        #222724 49%,
        #252a27 100%
      );

      border: 1px solid #3f4840;
      color: #eceade;
      font-family: 'Arial Narrow', Arial, sans-serif;
      font-size: clamp(18px, 3.8vw, 43px);
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .cell::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      border-top: 1px solid #111713;
    }

    .cell.changed {
      animation: flip .34s ease-in-out both;
    }

    @keyframes flip {
      48% {
        transform: perspective(300px) rotateX(-55deg);
        filter: brightness(.65);
      }
    }

    /* AIRLINE LOGO */

    .airlineDisplay {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .airlineDisplay .cells {
      flex: 1;
    }

    .logoFrame {
      width: 96px;
      height: 65px;
      flex: 0 0 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f1;
      border: 1px solid #555b55;
      border-radius: 3px;
      padding: 6px;
      overflow: hidden;
    }

    .logoFrame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: none;
    }

    .logoFallback {
      color: #303532;
      font-weight: bold;
      font-size: 14px;
      letter-spacing: .08em;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-top: 17px;
      border-top: 1px solid #41463f;
      color: #959a91;
      font-size: 11px;
      letter-spacing: .13em;
    }

    .status {
      color: #c5ae79;
      text-align: right;
    }

    @media(max-width: 650px) {
      .viewport { padding: 10px; }

      .board {
        padding: 15px 11px;
        gap: 14px;
      }

      .mast h1 { font-size: 22px; }
      .eyebrow { font-size: 9px; }
      .mastRight { font-size: 9px; }

      .dataRow {
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .name { font-size: 9px; }
      .rows { gap: 12px; }
      .cells { gap: 2px; }

      .cell {
        height: clamp(35px, 6.4vh, 56px);
        font-size: clamp(15px, 4.5vw, 30px);
      }

      .logoFrame {
        width: 74px;
        height: 52px;
        flex-basis: 74px;
      }

      .airlineDisplay { gap: 7px; }
      .footer { font-size: 9px; }
    }

    @media(max-height: 630px) {
      .viewport { padding: 8px; }

      .board {
        gap: 8px;
        padding: 12px;
      }

      .rows { gap: 7px; }
      .cell { height: clamp(25px, 5.7vh, 43px); }

      .logoFrame {
        height: 43px;
      }
    }

    @media(prefers-reduced-motion: reduce) {
      .cell.changed { animation: none; }
    }
  </style>
</head>

<body>
  <main class="viewport">
    <section class="board" aria-label="Flugzeuganzeige">

      <header class="mast">
        <div>
          <div class="eyebrow">
            LIVE AIR TRAFFIC · VIENNA
          </div>

          <h1>
            OVERHEAD <span aria-hidden="true">↗</span>
          </h1>
        </div>

        <div class="mastRight">
          <span class="signal"></span>
          <span id="mode">CONNECTING</span>

          <div style="margin-top:10px" id="clock">
            --:-- UTC
          </div>
        </div>
      </header>

      <div class="rows" id="rows"></div>

      <footer class="footer">
        <span id="location">
          VIENNA · 48.2082° N / 16.3738° E
        </span>

        <span class="status"
              id="status"
              aria-live="polite">
          STARTING…
        </span>
      </footer>

    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
